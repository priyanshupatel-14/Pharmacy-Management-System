# Development profile — uses H2 in-memory database (PostgreSQL-compatible mode)
# Activate with: --spring.profiles.active=dev

spring.datasource.url=jdbc:h2:mem:pharmacy_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Auto-run schema and seed on startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# H2 console for debugging (access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
