spring.application.name=pharmacy-management

# Server configuration
server.port=${PORT:8080}

# PostgreSQL DataSource configuration (via environment variables)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/pharmacy_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool settings
spring.datasource.hikari.maximum-pool-size=5

# Schema initialization (runs schema.sql and seed.sql on startup if needed)
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:schema.sql
